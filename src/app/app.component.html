<h3>Generate a custom menu item</h3>
<input type="text" [(ngModel)]="menuInput" />
<button (click)="this.theme.set(menuInput)">Generate</button>
<br />
@if (menuResource.isLoading()) { Loading... } @else {
<pre>{{ menuResource.value() }}</pre>
}

<h3>Structured menu item</h3>
<input type="text" [(ngModel)]="structuredMenuInput" />
<button (click)="this.structuredMenuTheme.set(structuredMenuInput)">
  Generate
</button>
@if (structuredMenuResource.isLoading()) { Loading... } @else {
<pre>{{ structuredMenuResource.value() | json }}</pre>
}
